log:
  level: info
  # 可选：轮转文件保存在数据卷，maxFiles 包含当前文件
  # file:
  #   path: /app/data/logs/asabot.log
  #   maxSize: 10MB
  #   maxFiles: 5
# timezone: Asia/Shanghai # 省略时使用环境变量 TZ 或系统时区
dataDir: /app/data
# 按需填写超管用户 ID（字符串）
superusers: []

pluginLoader:
  dirs: [/app/plugins]
  uploadDir: /app/plugins
  hotReload: auto
  setupTimeout: 30s

packages:
  dir: /app/data/packages
  registry: https://registry.npmjs.org
  npm: npm
  installTimeout: 5m

adapters:
  onebot11:
    # 按需添加正向连接，token 由环境变量提供
    connections: []
    # connections:
    #   - type: forward
    #     url: ws://host.docker.internal:3001
    #     accessToken: ${ONEBOT_TOKEN}
    # 按需启用反向连接，token 由环境变量提供
    # reverse:
    #   accessToken: ${ONEBOT_REVERSE_TOKEN}

server:
  host: 0.0.0.0
  port: 5140
  panelPassword: ${ASABOT_PANEL_PASSWORD}
  # 不需要对外 API 时留空
  apiToken: ${ASABOT_API_TOKEN:-}
