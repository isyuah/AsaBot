log:
  level: info
  # 可选：轮转文件保存在数据卷，maxFiles 包含当前文件
  # file:
  #   path: /app/data/logs/asabot.log
  #   maxSize: 10MB
  #   maxFiles: 5
# timezone: Asia/Shanghai # 省略时使用环境变量 TZ 或系统时区
dataDir: /app/data
# 框架管理员绑定平台、机器人和用户 ID；也可在面板设置中添加
superusers: []

command:
  suggest: direct

pluginLoader:
  dirs: [/app/plugins]
  uploadDir: /app/plugins
  hotReload: auto
  setupTimeout: 30s

packages:
  dir: /app/data/packages
  registry: https://registry.npmjs.org
  npm: npm
  installTimeout: 5m

adapterModules: []
# 可在面板「机器人 → 连接」中添加，或参考下列配置
connections: []
# connections:
#   - id: onebot-main
#     name: OneBot 主连接
#     adapter: onebot11
#     enabled: true
#     config:
#       type: forward
#       url: ws://host.docker.internal:3001
#       accessToken: ${ONEBOT_TOKEN}
#   - id: onebot-reverse
#     name: OneBot 反向监听
#     adapter: onebot11
#     enabled: true
#     config: { type: reverse, accessToken: '${ONEBOT_REVERSE_TOKEN:-}' }

server:
  host: 0.0.0.0
  port: 5140
  panelPassword: ${ASABOT_PANEL_PASSWORD}
  # 不需要对外 API 时留空
  apiToken: ${ASABOT_API_TOKEN:-}
