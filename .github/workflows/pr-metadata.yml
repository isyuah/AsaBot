name: PR metadata

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: write

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title-and-labels:
    name: Title and labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This job updates PR metadata only. PR code runs in CI with a read-only token.
      - name: Validate title and sync release label
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          title=$(jq -r '.title' <<< "$pr")
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|style|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: [^[:space:]]'
          if ! [[ "$title" =~ $pattern ]]; then
            echo '::error::Use type(scope): description for the PR title, for example fix(panel): show installed plugin READMEs. The scope is optional.'
            exit 1
          fi

          case "${BASH_REMATCH[1]}" in
            feat) expected=enhancement ;;
            fix) expected=bug ;;
            docs) expected=documentation ;;
            *) expected='' ;;
          esac

          endpoint="repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels"
          for label in enhancement bug documentation; do
            if jq -e --arg label "$label" 'any(.labels[]; .name == $label)' <<< "$pr" >/dev/null; then
              if [[ "$label" != "$expected" ]]; then
                gh api --method DELETE "$endpoint/$label" --silent
              fi
            elif [[ "$label" == "$expected" ]]; then
              gh api --method POST "$endpoint" --raw-field "labels[]=$label" --silent
            fi
          done
