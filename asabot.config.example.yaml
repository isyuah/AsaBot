log:
  # trace、debug、info、warn、error；面板可以临时调整，重启后恢复
  level: info
  # 可选：日志文件按大小轮转，maxFiles 包含当前文件
  # file:
  #   path: ./data/logs/asabot.log
  #   maxSize: 10MB
  #   maxFiles: 5
# cron 和“今日”统计的 IANA 时区；省略时优先使用 TZ，其次使用系统时区
# timezone: Asia/Shanghai
# 数据库及插件数据目录
dataDir: ./data
# 框架管理员必须绑定平台、机器人 ID 和该平台的用户 ID
superusers: []
# - { platform: onebot11, selfId: "10000", userId: "10001" }

command:
  # 命令前缀，可配置多个
  prefixes: ["/"]
  # 群里 @机器人 后允许省略前缀
  mentionAsPrefix: true
  # 私聊是否必须使用前缀
  privateRequirePrefix: false
  # 命令执行出错时回复通用提示
  replyOnError: true
  # 权限不足或首次进入冷却时回复提示
  replyOnDenied: true
  # 相似命令提示：off、direct（私聊或 @机器人）、always（包括带前缀的群消息）
  suggest: direct
  # overrides:
  #   echo: { enabled: false }

dispatch:
  # 单次处理安全上限，应大于多轮会话可能持续的时间
  handlerTimeout: 1h
  # 忽略机器人自身发出的消息
  ignoreSelf: true
  # 多轮提问的默认等待时间
  promptTimeout: 60s
  # 插件设置的提问超时上限
  maxPromptTimeout: 30m

# 额外适配器先通过 pnpm add 安装，再登记包名；重启后加载
adapterModules: []
connections:
  - id: onebot-main
    name: OneBot 主连接
    adapter: onebot11
    enabled: true
    config:
      type: forward
      url: ws://127.0.0.1:3001
      accessToken: ${ONEBOT_TOKEN:-}
      apiTimeout: 30s
      reconnect: { minDelay: 1s, maxDelay: 60s }
      sendQueue: { interval: 500ms, jitter: 300ms, maxPending: 100 }
  # 反向连接地址：ws://主机:5140/connections/onebot-reverse/onebot/v11/ws
  # - id: onebot-reverse
  #   name: OneBot 反向监听
  #   adapter: onebot11
  #   enabled: true
  #   config: { type: reverse, accessToken: '${ONEBOT_REVERSE_TOKEN:-}' }
  # - id: feishu-main
  #   name: 飞书主机器人
  #   adapter: feishu
  #   enabled: true
  #   config:
  #     appId: ${FEISHU_APP_ID}
  #     appSecret: ${FEISHU_APP_SECRET}
  #     apiTimeout: 30s
  #     mediaMaxBytes: 20971520

pluginLoader:
  # 从这些目录加载插件入口文件
  dirs: [./plugins]
  # 上传目录，默认使用 dirs 的第一个目录
  uploadDir: ./plugins
  # auto 表示非 production 环境启用热重载，也可设为 true 或 false
  hotReload: auto
  # 插件 setup 超时后回收资源并标记为 failed
  setupTimeout: 30s

packages:
  # 插件包和 npm 缓存目录，默认位于 dataDir/packages
  dir: ./data/packages
  # 可替换为可访问的 npm registry 镜像
  registry: https://registry.npmjs.org
  npm: npm
  installTimeout: 5m

tasks:
  maxConcurrent: 4
  historyRetention: 7d
  maxHistory: 10000

server:
  # 默认只允许本机访问；如需远程访问，请明确配置监听地址
  host: 127.0.0.1
  # HTTP 面板、对外 API 与反向 WebSocket 共用端口
  port: 5140
  # 面板密码为空时不启用面板和静态页面
  panelPassword: ${ASABOT_PANEL_PASSWORD:-}
  # API token 为空时不启用对外 API
  apiToken: ${ASABOT_API_TOKEN:-}

plugins:
  help:
    # 内置帮助命令
    enabled: true
  status:
    # 内置 ping 和运行状态命令
    enabled: true
  admin:
    # 内置插件管理和访问控制命令
    enabled: true
  http:
    # 提供支持代理、超时和响应大小限制的 HTTP 服务
    enabled: true
    config:
      proxy: ""
      noProxy: [] # 例如 [localhost, '*.example.com']
      timeout: 30s
      userAgent: "" # 为空时使用 AsaBot/<version>
  history:
    # 记录消息和分发追踪，默认忽略调试台的虚拟平台
    enabled: true
    config:
      retention: 7d
      maxMessages: 100000
      ignorePlatforms: [virtual]
  long-message:
    # 长消息优先尝试合并转发；也可选 image 或 split
    enabled: true
    config:
      threshold: 1000
      strategy: forward
      chunkSize: 800
      splitInterval: 1s
      markdownAsImage: true
  # 安装 @asabot/plugin-render 后可配置：
  # render:
  #   enabled: true
  #   config:
  #     fonts: [] # 用户字体的绝对路径；默认使用包内中文字体
  #     emoji: twemoji # 或 none
  #     emojiBaseUrl: https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/svg
  #     browser:
  #       concurrency: 2
  #       executablePath: /path/to/chrome # 或配置 wsEndpoint
  echo:
    # 示例复读插件
    enabled: true
    config:
      # 一次复读允许的最大文本长度
      maxLen: 200
      # 新成员入群时发送欢迎语，默认关闭
      welcome: false
  guess:
    # 示例猜数插件
    enabled: true
