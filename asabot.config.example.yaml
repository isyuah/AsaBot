log:
  # trace、debug、info、warn、error；面板可以临时调整，重启后恢复
  level: info
  # 可选：日志文件按大小轮转，maxFiles 包含当前文件
  # file:
  #   path: ./data/logs/asabot.log
  #   maxSize: 10MB
  #   maxFiles: 5
# cron 和“今日”统计的 IANA 时区；省略时优先使用 TZ，其次使用系统时区
# timezone: Asia/Shanghai
# 数据库及插件数据目录
dataDir: ./data
# 超管用户 ID，必须用引号保留为字符串
superusers: ["10001"]

command:
  # 命令前缀，可配置多个
  prefixes: ["/"]
  # 群里 @机器人 后允许省略前缀
  mentionAsPrefix: true
  # 私聊是否必须使用前缀
  privateRequirePrefix: false
  # 命令执行出错时回复通用提示
  replyOnError: true
  # 权限不足或首次进入冷却时回复提示
  replyOnDenied: true
  # 相似命令提示：off、direct（私聊或 @机器人）、always（包括带前缀的群消息）
  suggest: direct
  # overrides:
  #   echo: { enabled: false }

dispatch:
  # 单次处理安全上限，应大于多轮会话可能持续的时间
  handlerTimeout: 1h
  # 忽略机器人自身发出的消息
  ignoreSelf: true
  # 多轮提问的默认等待时间
  promptTimeout: 60s
  # 插件设置的提问超时上限
  maxPromptTimeout: 30m

adapters:
  onebot11:
    # 调用 OneBot API 的超时时间
    apiTimeout: 30s
    reconnect:
      # 断线重连的最短等待时间
      minDelay: 1s
      # 断线重连的最长等待时间
      maxDelay: 60s
    connections:
      # OneBot 11 正向 WebSocket 服务端
      - type: forward
        # OneBot 服务端地址；Docker 部署时注意端口和网络
        url: ws://127.0.0.1:3001
        # 从环境变量或 .env 读取 token；未设置时为空
        accessToken: ${ONEBOT_TOKEN:-}
    # OneBot 实现可以主动连接 AsaBot
    reverse:
      enabled: false
      accessToken: ${ONEBOT_REVERSE_TOKEN:-}
    sendQueue:
      # 同一个账号相邻两次发送消息的最短间隔；0 表示不限速
      interval: 500ms
      # 在间隔上增加 0 到此值之间的随机抖动
      jitter: 300ms
      # 等待发送的消息上限；断线时排队消息会被拒绝
      maxPending: 100

pluginLoader:
  # 从这些目录加载插件入口文件
  dirs: [./plugins]
  # 上传目录，默认使用 dirs 的第一个目录
  uploadDir: ./plugins
  # auto 表示非 production 环境启用热重载，也可设为 true 或 false
  hotReload: auto
  # 插件 setup 超时后回收资源并标记为 failed
  setupTimeout: 30s

packages:
  # 插件包和 npm 缓存目录，默认位于 dataDir/packages
  dir: ./data/packages
  # 可替换为可访问的 npm registry 镜像
  registry: https://registry.npmjs.org
  npm: npm
  installTimeout: 5m

tasks:
  maxConcurrent: 4
  historyRetention: 7d
  maxHistory: 10000

server:
  # 默认只允许本机访问；如需远程访问，请明确配置监听地址
  host: 127.0.0.1
  # HTTP 面板、对外 API 与反向 WebSocket 共用端口
  port: 5140
  # 面板密码为空时不启用面板和静态页面
  panelPassword: ${ASABOT_PANEL_PASSWORD:-}
  # API token 为空时不启用对外 API
  apiToken: ${ASABOT_API_TOKEN:-}

plugins:
  help:
    # 内置帮助命令
    enabled: true
  status:
    # 内置 ping 和运行状态命令
    enabled: true
  admin:
    # 内置插件管理和访问控制命令
    enabled: true
  http:
    # 提供支持代理、超时和响应大小限制的 HTTP 服务
    enabled: true
    config:
      proxy: ""
      noProxy: [] # 例如 [localhost, '*.example.com']
      timeout: 30s
      userAgent: "" # 为空时使用 AsaBot/<version>
  history:
    # 记录消息和分发追踪，默认忽略调试台的虚拟平台
    enabled: true
    config:
      retention: 7d
      maxMessages: 100000
      ignorePlatforms: [virtual]
  long-message:
    # 长消息优先尝试合并转发；也可选 image 或 split
    enabled: true
    config:
      threshold: 1000
      strategy: forward
      chunkSize: 800
      splitInterval: 1s
      markdownAsImage: true
  # 安装 @asabot/plugin-render 后可配置：
  # render:
  #   enabled: true
  #   config:
  #     fonts: [] # 用户字体的绝对路径；默认使用包内中文字体
  #     emoji: twemoji # 或 none
  #     emojiBaseUrl: https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/svg
  #     browser:
  #       concurrency: 2
  #       executablePath: /path/to/chrome # 或配置 wsEndpoint
  echo:
    # 示例复读插件
    enabled: true
    config:
      # 一次复读允许的最大文本长度
      maxLen: 200
      # 新成员入群时发送欢迎语，默认关闭
      welcome: false
  guess:
    # 示例猜数插件
    enabled: true
