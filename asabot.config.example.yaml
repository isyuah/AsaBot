# 日志级别：trace、debug、info、warn、error
logLevel: info
# 数据库及插件数据目录
dataDir: ./data
# 超管 QQ 号，必须用引号保留为字符串
superusers: ["10001"]

command:
  # 命令前缀，可配置多个
  prefixes: ["/"]
  # 群里 @机器人 后允许省略前缀
  mentionAsPrefix: true
  # 私聊是否必须使用前缀
  privateRequirePrefix: false
  # 命令执行出错时回复通用提示
  replyOnError: true
  # 权限不足或首次进入冷却时回复提示
  replyOnDenied: true

dispatch:
  # 单次处理安全上限，应大于多轮会话可能持续的时间
  handlerTimeout: 1h
  # 忽略机器人自身发出的消息
  ignoreSelf: true
  # 多轮提问的默认等待时间
  promptTimeout: 60s
  # 插件设置的提问超时上限
  maxPromptTimeout: 30m

onebot11:
  # 调用 OneBot API 的超时时间
  apiTimeout: 30s
  reconnect:
    # 断线重连的最短等待时间
    minDelay: 1s
    # 断线重连的最长等待时间
    maxDelay: 60s
  connections:
    # NapCat 的 OneBot 11 正向 WebSocket 服务端
    - type: forward
      # NapCat 服务端地址；Docker 部署时注意端口和网络
      url: ws://127.0.0.1:3001
      # 从环境变量或 .env 读取 token；未设置时为空
      accessToken: ${NAPCAT_TOKEN:-}

pluginLoader:
  # 从这些目录加载插件入口文件
  dirs: [./plugins]
  # auto 表示非 production 环境启用热重载，也可设为 true 或 false
  hotReload: auto

server:
  # 默认只允许本机访问；如需远程访问，请明确配置监听地址
  host: 127.0.0.1
  # HTTP 面板与对外 API 共用端口
  port: 5140
  # 面板密码为空时不启用面板和静态页面
  panelPassword: ${ASABOT_PANEL_PASSWORD:-}
  # API token 为空时不启用对外 API
  apiToken: ${ASABOT_API_TOKEN:-}

plugins:
  help:
    # 内置帮助命令
    enabled: true
  status:
    # 内置 ping 和运行状态命令
    enabled: true
  admin:
    # 内置插件管理和访问控制命令
    enabled: true
  echo:
    # 示例复读插件
    enabled: true
    config:
      # 一次复读允许的最大文本长度
      maxLen: 200
      # 新成员入群时发送欢迎语，默认关闭
      welcome: false
  guess:
    # 示例猜数插件
    enabled: true
